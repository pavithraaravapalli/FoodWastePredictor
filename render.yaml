# Render Blueprint: one web service + one managed PostgreSQL database.
databases:
  - name: foodwaste-db
    plan: basic-256mb        # paid plans include automatic backups; free databases expire - see DEPLOY_RENDER.md
    databaseName: foodwaste
    user: foodwaste

services:
  - type: web
    name: foodwaste-predictor
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn foodwaste_project.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --timeout 60"
    healthCheckPath: /login/
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: foodwaste-db
          property: connectionString
      - key: TOMTOM_API_KEY
        sync: false
      - key: TICKETMASTER_API_KEY
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
