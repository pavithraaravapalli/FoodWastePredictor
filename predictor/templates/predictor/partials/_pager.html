{% if page.has_other_pages %}
<nav class="pager" aria-label="Pagination">
    {% if page.has_previous %}<a class="btn btn-ghost btn-sm" href="?{% if querystring %}{{ querystring }}&{% endif %}page={{ page.previous_page_number }}"><i data-lucide="chevron-left"></i>Previous</a>{% else %}<span></span>{% endif %}
    <span class="muted-text">Page {{ page.number }} of {{ page.paginator.num_pages }}</span>
    {% if page.has_next %}<a class="btn btn-ghost btn-sm" href="?{% if querystring %}{{ querystring }}&{% endif %}page={{ page.next_page_number }}">Next<i data-lucide="chevron-right"></i></a>{% else %}<span></span>{% endif %}
</nav>
{% endif %}
